name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test Pulse.Tests/Pulse.Tests.csproj -c Release --nologo
