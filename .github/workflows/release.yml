# Builds Pulse-Setup.exe and publishes it to:
#   1. MugoJnr/pulse            (GITHUB_TOKEN) so installed copies of the old updater still see it
#   2. MugoJnr/pulse-releases   (secret RELEASES_REPO_TOKEN) the public feed, installer only
#
# RELEASES_REPO_TOKEN is a fine-grained PAT with Contents read/write on pulse-releases only.
# Create it under GitHub Settings → Developer settings → Fine-grained tokens, then add it as
# an Actions secret on MugoJnr/pulse. Do not commit the token. It expires; renew the secret.
# The workflow fails the publish step when the secret is missing.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (vX.Y.Z). Required unless this run was started by pushing that tag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test Pulse.Tests/Pulse.Tests.csproj -c Release --nologo

      - name: Build Pulse-Setup.exe
        shell: pwsh
        run: ./build-setup.ps1

      - name: Publish to pulse and pulse-releases
        shell: pwsh
        env:
          # Source-repo release. This token cannot publish to another repository.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo publish. Contents read/write on MugoJnr/pulse-releases only.
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          $notes = ""
          $type = (git cat-file -t $tag 2>$null)
          if ($LASTEXITCODE -eq 0 -and $type.Trim() -eq "tag") {
            $notes = git tag -l --format="%(contents)" $tag
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Pulse " + $tag.TrimStart("vV")
          }
          $notesPath = Join-Path $env:RUNNER_TEMP "pulse-release-notes.md"
          Set-Content -Path $notesPath -Value $notes.Trim() -Encoding utf8
          & ./scripts/publish-release.ps1 -Tag $tag -Setup .\setup\Pulse-Setup.exe -NotesFile $notesPath -Target both
